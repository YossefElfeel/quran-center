# Supabase local config — used by `supabase start` in CI to stand up a local
# stack (Postgres 17 + auth) and apply migrations + seed, so the RLS isolation
# suite and integration tests can run on a faithful copy of the schema.
# Not used against the hosted project (that's managed via MCP/migrations).
project_id = "quran-center"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

# Storage must be on — a migration seeds storage.buckets for media.
[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/confirm", "http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Recovery and invite links use token_hash (verifyOtp on web /auth/confirm), so they
# work on any device — unlike PKCE ?code= links, which only the requesting device can redeem.
# {{ .SiteURL }} must be the public web site (hosted: https://quran-web-sage.vercel.app).
# The hosted project does not read this file: paste the same HTML in Auth → Email Templates
# (see docs/DEPLOY_RUNBOOK.md).
[auth.email.template.recovery]
subject = "استعادة كلمة السر — دار تحفيظ القرآن"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "تفعيل حسابك في دار تحفيظ القرآن"
content_path = "./supabase/templates/invite.html"

[analytics]
enabled = false

[edge_runtime]
enabled = false
