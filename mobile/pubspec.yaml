name: quran_center
description: "منصة مركز تحفيظ القرآن"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  intl: ^0.20.2
  supabase_flutter: ^2.15.0
  uuid: ^4.5.3
  pdf: ^3.13.0
  printing: ^5.15.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  google_mlkit_text_recognition: ^0.15.1
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  connectivity_plus: ^7.1.1
  path: ^1.9.1
  image: ^4.9.1
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  shared_preferences: ^2.5.5
  file_picker: 8.1.4
  cached_network_image: ^3.4.1
  hijri: ^3.0.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  mocktail: ^1.0.5
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# ملاحظة: حزم الطرف الثالث (riverpod / go_router / intl / build_runner ...) بتتضاف
# عبر `flutter pub add` عشان تتحلّ على آخر إصدار متوافق، مش بأرقام يدوية.

flutter:
  uses-material-design: true
  generate: true # توليد ملفات الترجمة (gen-l10n) من lib/l10n/*.arb

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    # Amiri: خط قرآني بالتشكيل — يُستخدم لنص القرآن في الـ PDF (آية الشهادة).
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf

# أيقونة التطبيق — المصدر من شعار الدار (web/public/logo.svg) متصدّر PNG في
# assets/branding. بعد أي تعديل: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "ic_launcher"
  # iOS متوقّف: الأداة بتعدّل project.pbxproj غلط
  # (ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS) — نفعّله لما
  # نجهّز بناء iOS ونراجع التعديلات يدويًا.
  ios: false
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0C7C59"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/app_icon_foreground.png"
  # الـ PNG نفسه فيه هامش منطقة الأمان (٦٦ من ١٠٨dp) فمش محتاجين inset إضافي.
  adaptive_icon_foreground_inset: 0

# شاشة البداية (native splash) بلون البراند + الشعار.
# بعد أي تعديل: `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#0C7C59"
  image: "assets/branding/splash_logo.png"
  android: true
  ios: false
  web: false
  android_12:
    color: "#0C7C59"
    image: "assets/branding/splash_android12.png"
    icon_background_color: "#0C7C59"
