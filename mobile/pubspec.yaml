name: quran_center
description: "منصة مركز تحفيظ القرآن"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  intl: ^0.20.2
  supabase_flutter: ^2.15.0
  uuid: ^4.5.3
  pdf: ^3.13.0
  printing: ^5.15.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  mocktail: ^1.0.5

# ملاحظة: حزم الطرف الثالث (riverpod / go_router / intl / build_runner ...) بتتضاف
# عبر `flutter pub add` عشان تتحلّ على آخر إصدار متوافق، مش بأرقام يدوية.

flutter:
  uses-material-design: true
  generate: true # توليد ملفات الترجمة (gen-l10n) من lib/l10n/*.arb

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
