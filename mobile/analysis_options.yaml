# تحليل صارم — يطابق مبادئ الخطة (const إلزامي، مفيش print).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # const إلزامي للأداء (مبدأ تفكيك الـ widgets)
    prefer_const_constructors: error
    prefer_const_constructors_in_immutables: error
    prefer_const_declarations: error
    prefer_const_literals_to_create_immutables: error
    avoid_print: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
    - "build/**"

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - avoid_print
    - use_key_in_widget_constructors
    - use_super_parameters
    - prefer_final_locals
    - sized_box_for_whitespace
    - sort_child_properties_last
    - unawaited_futures
    - directives_ordering
